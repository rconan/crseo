[package]
name = "crseo"
version = "2.5.3"
description = "Cuda Engined Optics Rust Interface"
documentation = "https://docs.rs/crseo"
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[workspace]
members = ["modes-set", "gmt-partial", "gni"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Rod Conan <rconan@gmto.org>"]
repository = "https://github.com/rconan/crseo"
categories = ["api-bindings", "science", "simulation"]
keywords = ["telescope", "astronomy"]

[workspace.dependencies]
anyhow = "1.0.99"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.18"
serde-pickle = "1.2.0"

[dependencies]
ffi = { version = "1.3.2", path = "sys", package = "crseo-sys" }
rand = "0.10"
serde.workspace = true
libm = "0.2.16"
roots = "0.0.8"
rayon = "1.12"
log = "0.4.29"
thiserror.workspace = true
skyangle = "0.4.0"
indicatif = "0.18.4"
toml = "1.1.2"
serde-pickle.workspace = true
nalgebra = { version = "0.34", features = ["serde-serialize"] }
anyhow = "1.0.102"
complot = { version = "0.3.5", optional = true }
crseo_modes-set = { version = "0.1.0", path = "modes-set", features = [
  "delaunay",
], optional = true }

[dev-dependencies]
bincode = "1.3.3"
gnuplot = "0.0.46"
# plotters = "0.3.1"
zernike = "0.2.2"
nanorand = "0.8.0"
criterion = "0.8.2"
env_logger = "0.11.10"
triangle-rs = "0.1.2"

[features]
modes-set = ["dep:crseo_modes-set"]
analytic = []
spade = []

[[bench]]
name = "ceo_benchmark"
harness = false

[[bench]]
name = "ray_tracing"
harness = false

[[bin]]
name = "analytic"
required-features = ["analytic"]

[package.metadata.docs.rs]
features = ["modes-set"]
