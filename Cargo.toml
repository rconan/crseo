[package]
name = "crseo"
version = "2.5.3"
authors = ["Rod Conan <rconan@gmto.org>"]
edition = "2021"
license = "MIT"
description = "Cuda Engined Optics Rust Interface"
repository = "https://github.com/rconan/crseo"
documentation = "https://docs.rs/crseo"
readme = "README.md"
categories = ["api-bindings", "science", "simulation"]
keywords = ["telescope", "astronomy"]

[workspace]
members = ["gmt-partial"]

[dependencies]
ffi = { version = "1.3.2", path = "sys", package = "crseo-sys" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
libm = "0.2.16"
roots = "0.0.8"
rayon = "1.12"
log = "0.4.29"
thiserror = "2.0.18"
skyangle = "0.4.0"
indicatif = "0.18.4"
toml = "1.1.2"
serde-pickle = "1.2.0"
nalgebra = { version = "0.34", features = ["serde-serialize"] }

[dev-dependencies]
bincode = "1.3.3"
gnuplot = "0.0.46"
# plotters = "0.3.1"
env_logger = "0.11.10"
anyhow = "1.0.102"
zernike = "0.2.2"
nanorand = "0.8.0"
complot = "0.3.5"
criterion = "0.8.2"

[features]
analytic = []

[[bench]]
name = "ceo_benchmark"
harness = false

[[bench]]
name = "ray_tracing"
harness = false

[[bin]]
name = "analytic"
required-features = ["analytic"]
